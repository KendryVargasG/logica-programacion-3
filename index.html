<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Práctica Factorial</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="contenedor">

        
        <img src="img/cuaderno.png" alt="Cuaderno" class="cuaderno">

        <!-- CALCULADORA -->
        <img src="img/calculadora.png" alt="Calculadora" class="calculadora">

        <!-- PERSONAJE -->
        <img src="img/personaje.png" alt="Personaje" class="personaje">

        <!-- CONTENIDO DEL CUADERNO -->

        <div class="contenido">

            <h1>PRÁCTICA FACTORIAL</h1>

            <div class="instrucciones">

                <h3>INSTRUCCIONES:</h3>

                <p>✅ Ingrese un número entero.</p>

                <p>✅ Presione el botón Calcular.</p>

                <p>✅ Observe el resultado.</p>

            </div>

            <div class="entrada">

                <label>INGRESE UN NÚMERO:</label>

                <input type="number" id="numero">

                <button onclick="calcularFactorial()">
                    CALCULAR
                </button>

            </div>

        </div>

        <!-- RESULTADO -->

        <div class="resultado">

            <div id="resultado">
                Mira aquí el resultado...
            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>

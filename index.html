<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Práctica Factorial</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="contenedor">

        <img src="IMG/cuaderno.png" class="cuaderno" alt="cuaderno">

        <img src="IMG/numeros.png" class="numeros" alt="numeros decorativos">

        <img src="IMG/logogeneration.png" class="logo" alt="logo Generation Colombia">

        <img src="IMG/calculadora.png" class="calculadora" alt="calculadora">

        <img src="IMG/personaje.png" class="personaje" alt="personaje">

        <img src="IMG/cuadroresultado.png" class="cuadroresultado" alt="resultado">

        <img src="IMG/cuadroingreso valor.png" class="cuadroingreso" alt="ingreso">


        <div class="contenido-cuaderno">

            <h1>PRÁCTICA FACTORIAL</h1>

            <div class="instrucciones">

                <h3>INSTRUCCIONES:</h3>

                <p>✅ Ingrese un número entero.</p>
                <p>✅ Presione el botón calcular.</p>
                <p>✅ Mira el resultado.</p>

            </div>

            <div class="zona-ingreso">

                <label>Ingrese un número:</label>

                <input type="number" id="numero" placeholder="Escribe Aquí">
    

                <button onclick="calcularFactorial()">
                    CALCULAR
                </button>

            </div>

        </div>


        <div id="resultado">
            Mira aquí el resultado...
        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
